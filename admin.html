<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Document System - Admin Portal</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS File -->
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script> 
</head>
<body class="admin-body min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4">

    <!-- Header Logo & Title -->
    <div class="text-center mb-6">
        <div class="w-12 h-12 bg-blue-100 text-[#1e3a8a] rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
            <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Barangay Admin Portal</h1>
        <p class="text-xs font-medium text-gray-500 mt-1">Administrator Access</p>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xl p-8">
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Username or Email</label>
                <div class="relative">
                    <input type="text" id="adminUser" required placeholder="Enter username" 
                        class="w-full pl-4 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="adminPassword" required placeholder="Enter password" 
                        class="w-full pl-4 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] focus:bg-white transition">
                </div>
            </div>

            <div id="adminAlert" class="hidden text-sm text-center py-2 rounded-lg font-medium"></div>

            <button type="submit" class="w-full bg-[#1e3a8a] hover:bg-blue-900 text-white font-bold py-3 rounded-xl text-xs shadow-md transition">
                Login as Admin
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <a href="index.html" class="inline-flex items-center text-xs font-semibold text-gray-500 hover:text-blue-900 transition-colors">
                &larr; Back to Resident Login
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                window.location.replace('admin-dashboard.html');
            }
        });

        async function handleAdminLogin(event) {
            event.preventDefault();
            const alertBox = document.getElementById('adminAlert');
            const usernameInput = document.getElementById('adminUser').value.trim().toLowerCase();
            const passwordInput = document.getElementById('adminPassword').value;

            // 1. Check client-side registered officials database first
            const storedOfficials = JSON.parse(localStorage.getItem('barangayOfficials') || '[]');
            const localAccount = storedOfficials.find(
                acc => (acc.username && acc.username.toLowerCase() === usernameInput) || 
                       (acc.email && acc.email.toLowerCase() === usernameInput)
            );

            if (localAccount) {
                if (localAccount.password === passwordInput) {
                    grantAccess({
                        name: localAccount.name,
                        username: localAccount.username,
                        role: localAccount.role || 'Barangay Official'
                    });
                    return;
                } else {
                    showAlert(alertBox, 'Invalid credentials. Password incorrect.', 'bg-rose-100 text-rose-800 border border-rose-300');
                    return;
                }
            }

            // 2. Default System Admin Account
            if ((usernameInput === 'admin' || usernameInput === 'admin@barangay.gov') && passwordInput === 'admin') {
                grantAccess({ name: 'Admin Master', username: 'admin', role: 'System Admin' });
                return;
            }

            // 3. Fallback check to Server API
            try {
                const response = await fetch('https://e-barangay-connect.onrender.com/api/auth/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    grantAccess(data.user);
                } else {
                    showAlert(alertBox, data.error || 'Invalid credentials.', 'bg-rose-100 text-rose-800 border border-rose-300');
                }
            } catch (err) {
                showAlert(alertBox, 'Invalid username or password.', 'bg-rose-100 text-rose-800 border border-rose-300');
            }
        }

        function grantAccess(userData) {
            const alertBox = document.getElementById('adminAlert');
            localStorage.setItem('isAdminLoggedIn', 'true');
            localStorage.setItem('adminUser', JSON.stringify(userData));
            showAlert(alertBox, 'Access granted! Opening Admin Portal...', 'bg-emerald-100 text-emerald-800 border border-emerald-300');
            setTimeout(() => {
                window.location.replace('admin-dashboard.html');
            }, 800);
        }

        function showAlert(element, text, classes) {
            element.className = `text-sm text-center py-2 px-3 rounded-lg font-medium ${classes}`;
            element.innerText = text;
            element.classList.remove('hidden');
        }
    </script>
</body>
</html>
