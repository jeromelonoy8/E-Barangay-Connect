<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Admin Portal - Manage Requests</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- External Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body id="appBody" class="font-sans antialiased text-gray-800 bg-slate-50 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#1e3a8a] text-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2 font-semibold text-lg tracking-wide">
                <span>Barangay Admin Portal</span>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="admin-dashboard.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-solid fa-border-all text-xs"></i>
                    <span>Dashboard</span>
                </a>
                <a href="manage-requests.html" class="flex items-center space-x-2 text-white font-semibold">
                    <i class="fa-regular fa-file-lines text-xs"></i>
                    <span>Manage Requests</span>
                </a>
                <a href="announcements.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-solid fa-bullhorn text-xs"></i>
                    <span>Announcements</span>
                </a>
                <a href="add-official.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-solid fa-user-plus text-xs"></i>
                    <span>Add Official</span>
                </a>

                <!-- Profile Link & Button -->
                <button onclick="openProfileModal()" class="flex items-center space-x-2 text-blue-100 hover:text-white transition cursor-pointer border-l border-blue-800/80 pl-4">
                    <div id="navAvatarContainer" class="w-6 h-6 rounded-full bg-blue-200 text-[#1e3a8a] flex items-center justify-center text-[10px] font-bold overflow-hidden shrink-0">
                        <span id="navAvatarInitial"></span>
                    </div>
                    <span id="navProfileName">Profile</span>
                </button>

                <button onclick="handleLogout()" class="flex items-center space-x-1.5 text-blue-100 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-6">
        
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Manage Document Requests</h1>
            <p class="text-gray-500 text-sm mt-1">Review, approve, reject, and monitor resident clearance applications.</p>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="filterRequests()" placeholder="Search resident name or ID..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] focus:bg-white transition">
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                <label class="text-xs font-semibold text-slate-500 shrink-0">Filter Status:</label>
                <select id="statusFilter" onchange="filterRequests()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] transition">
                    <option value="ALL">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Ready for Pickup">Ready for Pickup</option>
                    <option value="Completed">Completed</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
        </div>

        <!-- Document Requests Table Container -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                            <th class="py-3.5 px-6">Request ID</th>
                            <th class="py-3.5 px-6">Resident Name</th>
                            <th class="py-3.5 px-6">Document Type</th>
                            <th class="py-3.5 px-6">Date Submitted</th>
                            <th class="py-3.5 px-6">Status</th>
                            <th class="py-3.5 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody" class="divide-y divide-slate-100 text-xs text-slate-700">
                        <!-- Dynamic database content will render here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="api-client.js"></script>
    <script>
        const session = Api.requireSession('admin');
        let allRequests = [];

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        if (session) {
            Api.setupAdminNav();
            loadAllAdminRequests();
        }

        async function loadAllAdminRequests() {
            const tableBody = document.getElementById('requestsTableBody');
            try {
                // Fetch live data directly from the MySQL database endpoint
                const data = await Api.get('admin', '/api/admin/requests');
                allRequests = Array.isArray(data) ? data : (data.requests || []);
                filterRequests();
            } catch (err) {
                console.error('Error fetching admin requests:', err);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-slate-400 font-medium">
                            Failed to load document requests from database.
                        </td>
                    </tr>
                `;
            }
        }

        function filterRequests() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusVal = document.getElementById('statusFilter').value;
            const tableBody = document.getElementById('requestsTableBody');

            const filtered = allRequests.filter(req => {
                const refNo = String(req.reference_no || req.id || '').toLowerCase();
                const name = String(req.resident_name || req.full_name || '').toLowerCase();
                const docType = String(req.document_type || '').toLowerCase();

                const matchesSearch = refNo.includes(searchVal) || name.includes(searchVal) || docType.includes(searchVal);
                const matchesStatus = (statusVal === 'ALL') || (req.status === statusVal);

                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-slate-400 font-medium">
                            No matching document requests found.
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = filtered.map(req => {
                const fileCount = req.file_count || (req.attachments ? req.attachments.length : 0);
                const attachmentText = fileCount > 0 ? `View (${fileCount} file${fileCount > 1 ? 's' : ''})` : 'View';

                return `
                    <tr class="hover:bg-slate-50/60 transition">
                        <td class="py-4 px-6 font-bold text-slate-900">${Api.escape(req.reference_no || `REQ-${String(req.id).padStart(4, '0')}`)}</td>
                        <td class="py-4 px-6 font-bold text-slate-900">${Api.escape(req.resident_name || req.full_name || 'Resident')}</td>
                        <td class="py-4 px-6 text-slate-600">${Api.escape(req.document_type || 'Document')}</td>
                        <td class="py-4 px-6 text-slate-400 font-medium">${Api.escape(Api.formatDate(req.created_at || req.date_submitted))}</td>
                        <td class="py-4 px-6">
                            <span class="text-[10px] font-bold px-3 py-1 rounded-full border ${Api.statusBadge(req.status)}">
                                ${Api.escape(req.status)}
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right space-x-2">
                            ${renderActionButtons(req, attachmentText)}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderActionButtons(req, attachmentText) {
            const status = req.status;

            if (status === 'Pending') {
                return `
                    <button onclick="updateStatus(${req.id}, 'Approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">Approve</button>
                    <button onclick="updateStatus(${req.id}, 'Rejected')" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">Reject</button>
                `;
            } else if (status === 'Approved') {
                return `
                    <button onclick="updateStatus(${req.id}, 'Ready for Pickup')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">Mark Ready for Pickup</button>
                `;
            } else if (status === 'Ready for Pickup') {
                return `
                    <button onclick="updateStatus(${req.id}, 'Completed')" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">Mark Completed</button>
                `;
            }

            return `<span class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold">${attachmentText}</span>`;
        }

        async function updateStatus(id, newStatus) {
            if (!confirm(`Are you sure you want to change the status to "${newStatus}"?`)) return;

            try {
                await Api.request('admin', 'PUT', `/api/admin/requests/${id}/status`, {
                    json: { status: newStatus }
                });
                loadAllAdminRequests();
            } catch (err) {
                alert(err.message || 'Failed to update request status.');
            }
        }
    </script>
</body>
</html>
