<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Document System - Resident Portal</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS File -->
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center py-10 font-sans">

    <!-- Header Logo & Title -->
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 text-white rounded-full mb-3 shadow-md">
            <i data-lucide="building-2" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Barangay Document System</h1>
        <p class="text-sm font-medium text-gray-500 mt-1">Resident Portal</p>
    </div>

    <!-- Main Auth Card -->
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        
        <!-- Registration View -->
        <div id="registerView" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Create an Account</h2>
            
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="username" required placeholder="Choose a username" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" required placeholder="Enter your email" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contact Number</label>
                    <div class="relative">
                        <i data-lucide="phone" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="tel" id="contact" required placeholder="Enter your contact number" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" required placeholder="Create a password" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="confirmPassword" required placeholder="Confirm your password" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div id="alertMessage" class="hidden text-sm text-center py-2 rounded-lg font-medium"></div>

                <button type="submit" 
                    class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-3 rounded-lg transition-colors duration-200 mt-2">
                    Register
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-sm text-blue-900 font-medium hover:underline cursor-pointer" onclick="toggleAuthView()">
                    Already have an account? Login here
                </p>
            </div>
        </div>

        <!-- Login View (Default Active View) -->
        <div id="loginView">
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username or Email</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="loginUser" required placeholder="Enter username or email" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="loginPassword" required placeholder="Enter password" 
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-gray-700 text-sm">
                    </div>
                </div>

                <div id="loginAlert" class="hidden text-sm text-center py-2 rounded-lg font-medium"></div>

                <button type="submit" 
                    class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-3 rounded-lg transition-colors duration-200 mt-2">
                    Login
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-sm text-blue-900 font-medium hover:underline cursor-pointer" onclick="toggleAuthView()">
                    Don't have an account? Register here
                </p>
            </div>

            <!-- Admin Login Button Footer -->
            <div class="mt-6 pt-4 border-t border-gray-100 text-center">
                <a href="admin.html" class="inline-flex items-center text-xs font-semibold text-gray-600 hover:text-blue-900 transition-colors">
                    Admin Login &rarr;
                </a>
            </div>

        </div>

    </div>

    <script>
        // Local copies (localhost, Live Server, or opened as a file) talk to the local API on port 5000.
        // Deployed copies (the pages are hosted on Vercel) talk to the backend hosted on Render.
        const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:'
            ? 'http://localhost:5000'
            : 'https://e-barangay-connect.onrender.com';

        lucide.createIcons();

        function toggleAuthView() {
            document.getElementById('registerView').classList.toggle('hidden');
            document.getElementById('loginView').classList.toggle('hidden');
        }

        async function handleRegister(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert(alertBox, 'Passwords do not match!', 'bg-red-100 text-red-700');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        email: email, 
                        phone_number: contact, 
                        password: password 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(alertBox, 'Registration successful! Switching to login...', 'bg-green-100 text-green-700');
                    setTimeout(() => {
                        toggleAuthView();
                        document.getElementById('registerForm').reset();
                        alertBox.classList.add('hidden');
                    }, 1500);
                } else {
                    showAlert(alertBox, data.error || 'Registration failed.', 'bg-red-100 text-red-700');
                }
            } catch (err) {
                showAlert(alertBox, 'Cannot connect to server.', 'bg-red-100 text-red-700');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const loginAlert = document.getElementById('loginAlert');
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    showAlert(loginAlert, `Welcome back, ${data.user.username}! Redirecting...`, 'bg-green-100 text-green-700');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert(loginAlert, data.error || 'Invalid username or password.', 'bg-red-100 text-red-700');
                }
            } catch (err) {
                showAlert(loginAlert, 'Cannot connect to server.', 'bg-red-100 text-red-700');
            }
        }

        function showAlert(element, text, classes) {
            element.className = `text-sm text-center py-2 rounded-lg font-medium ${classes}`;
            element.innerText = text;
            element.classList.remove('hidden');
        }
    </script>
</body>
</html>
