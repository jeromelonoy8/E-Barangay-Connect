<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Document System - Request Status</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- External CSS File -->
    <link rel="stylesheet" href="styles.css">

    <!-- Senior Mode Accessible Styles -->
    <style id="senior-mode-styles">
        body.senior-mode {
            font-size: 1.15rem !important;
            background-color: #f8fafc !important;
        }

        /* Enlarge Headings */
        body.senior-mode h1 { font-size: 2.25rem !important; font-weight: 800 !important; }
        body.senior-mode h2 { font-size: 1.5rem !important; }

        /* Interactive elements */
        body.senior-mode button, 
        body.senior-mode a {
            font-size: 1.05rem !important;
        }

        /* Senior Mode High-Contrast Cards */
        body.senior-mode .status-card {
            border: 2px solid #1e3a8a !important;
            background-color: #ffffff !important;
        }

        body.senior-mode label,
        body.senior-mode p, 
        body.senior-mode span {
            font-size: 1.05rem !important;
            color: #0f172a !important;
        }
    </style>
</head>
<body id="appBody" class="font-sans antialiased text-gray-800 bg-slate-50 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#1e3a8a] text-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2 font-semibold text-lg tracking-wide">
                <i class="fa-solid fa-building-columns text-base"></i>
                <span>Barangay Document System</span>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="dashboard.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-solid fa-border-all text-xs"></i>
                    <span>Dashboard</span>
                </a>
                <a href="new-request.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-regular fa-square-plus text-xs"></i>
                    <span>New Request</span>
                </a>
                <a href="status.html" class="flex items-center space-x-2 text-white font-semibold">
                    <i class="fa-regular fa-clock text-xs"></i>
                    <span>Status</span>
                </a>
                <a href="appointment.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-regular fa-calendar text-xs"></i>
                    <span>Appointment</span>
                </a>
                <a href="profile.html" class="flex items-center space-x-2 text-blue-100 hover:text-white transition">
                    <i class="fa-regular fa-user text-xs"></i>
                    <span>Profile</span>
                </a>

                <!-- Senior Mode Toggle Button -->
                <button id="seniorModeBtn" onclick="toggleSeniorMode()" class="bg-amber-400 hover:bg-amber-500 text-gray-900 font-bold px-3 py-1 rounded-md text-xs flex items-center space-x-1 transition cursor-pointer">
                    <i class="fa-regular fa-eye"></i>
                    <span id="seniorBtnText">Senior Mode</span>
                </button>

                <button onclick="handleLogout()" class="flex items-center space-x-1.5 text-blue-100 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-6 py-8 flex-1 w-full space-y-6">
        
        <!-- Page Header -->
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Request Status</h1>
            <p class="text-gray-500 text-sm mt-1">Track the status of your document requests, view submitted attachments, or manage your requests</p>
        </div>

        <!-- Dynamic Request Status List -->
        <div id="requestsListContainer" class="space-y-4">
            <!-- Loaded from the API -->
        </div>

    </main>

    <!-- Modal for Viewing Submitted File Preview -->
    <div id="fileModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-file-contract text-[#1e3a8a]"></i>
                    <h3 class="font-bold text-gray-900 text-base" id="modalFileName">Submitted Document</h3>
                </div>
                <button onclick="closeFileModal()" class="text-gray-400 hover:text-gray-600 text-lg cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="modalFileContent" class="py-2 max-h-[70vh] overflow-y-auto">
                <!-- Uploaded files are shown here -->
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                <span class="text-xs text-slate-400"><i class="fa-solid fa-lock mr-1"></i> Secure File View</span>
                <button onclick="closeFileModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition cursor-pointer">
                    Close Preview
                </button>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        lucide.createIcons();

        const session = Api.requireSession('resident');
        Api.setupResidentNav();

        const STATUS_NOTES = {
            'Pending': 'Your request has been received and is waiting for review by the barangay office.',
            'Approved': 'Your request has been approved and is being prepared.',
            'Ready for Pickup': 'Your document is ready. Please claim it at the Barangay Hall and bring a valid ID.',
            'Completed': 'Your document has been released. Thank you!',
            'Rejected': 'Your request was not approved. See the reason below, then resubmit the corrected requirement.',
            'Cancelled': 'You cancelled this request.'
        };

        if (session) renderRequests();

        async function renderRequests() {
            const container = document.getElementById('requestsListContainer');
            let requests;
            try {
                requests = await Api.get('resident', '/api/requests/mine');
            } catch (err) {
                container.innerHTML = `<p class="text-sm text-red-600">${Api.escape(err.message)}</p>`;
                return;
            }

            if (requests.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
                        <i class="fa-regular fa-folder-open text-4xl text-slate-300"></i>
                        <div>
                            <p class="text-gray-700 font-bold text-base">No document requests found</p>
                            <p class="text-gray-400 text-xs mt-0.5">Submit a new request to track its progress here.</p>
                        </div>
                        <a href="new-request.html" class="inline-block mt-2 text-xs bg-[#1e3a8a] text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
                            <i class="fa-regular fa-square-plus mr-1"></i> Create Request
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = requests.map(req => `
                <div class="status-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">

                    <div class="flex items-center justify-between border-b pb-3 border-gray-100">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold bg-[#1e3a8a] text-white px-2.5 py-0.5 rounded">${Api.escape(req.reference_no)}</span>
                            <span class="text-xs font-bold px-3 py-0.5 rounded-full border ${Api.statusBadge(req.status)}">
                                ${Api.escape(req.status)}
                            </span>
                        </div>
                        <span class="text-xs text-gray-400 font-medium">
                            <i class="fa-regular fa-calendar mr-1"></i> Submitted on ${Api.escape(Api.formatDate(req.created_at))}
                        </span>
                    </div>

                    <div>
                        <h2 class="text-lg font-bold text-gray-900 flex items-center space-x-2">
                            <i class="fa-regular fa-file-lines text-[#1e3a8a]"></i>
                            <span>${Api.escape(req.document_type)}</span>
                        </h2>
                        <p class="text-xs text-gray-500 mt-1 font-medium">Purpose: ${Api.escape(req.purpose || 'Not specified')}</p>
                        ${req.fee > 0 ? `<p class="text-xs text-gray-500 mt-0.5 font-medium">Fee: ₱${req.fee.toFixed(2)}</p>` : ''}
                    </div>

                    <div class="bg-blue-50/60 border border-blue-100 rounded-xl p-3.5 text-xs text-blue-900 flex items-start space-x-2.5">
                        <i class="fa-solid fa-circle-info text-blue-800 text-sm mt-0.5"></i>
                        <div>
                            <p class="font-bold text-blue-900">Status Notes:</p>
                            <p class="text-slate-600 mt-0.5">${Api.escape(STATUS_NOTES[req.status] || '')}</p>
                            ${req.reviewed_by_name ? `<p class="text-slate-400 mt-1">Reviewed by ${Api.escape(req.reviewed_by_name)} on ${Api.escape(Api.formatDate(req.reviewed_at))}</p>` : ''}
                        </div>
                    </div>

                    ${req.status === 'Rejected' && req.rejection_reason ? `
                        <div class="bg-red-50 border border-red-200 rounded-xl p-3.5 text-xs text-red-900 flex items-start space-x-2.5">
                            <i class="fa-solid fa-circle-xmark text-red-600 text-base mt-0.5"></i>
                            <div>
                                <p class="font-bold text-red-900">Reason for Rejection:</p>
                                <p class="text-red-700 mt-0.5 font-medium">${Api.escape(req.rejection_reason)}</p>
                            </div>
                        </div>
                    ` : ''}

                    <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                        <button onclick="viewFiles(${req.request_id})" class="text-xs font-bold text-[#1e3a8a] hover:text-blue-800 flex items-center space-x-1 cursor-pointer">
                            <i class="fa-regular fa-eye"></i>
                            <span>View Files (${req.file_count})</span>
                        </button>
                        <div class="flex items-center gap-2">
                            ${req.status === 'Rejected' ? `
                                <button onclick="resubmitRequest(${req.request_id})" class="px-3 py-1.5 text-xs font-semibold text-white bg-[#1e3a8a] hover:bg-blue-900 rounded-lg transition cursor-pointer">
                                    <i class="fa-solid fa-upload mr-1"></i> Resubmit Requirement
                                </button>
                            ` : ''}
                            ${req.status === 'Pending' ? `
                                <button onclick="cancelRequest(${req.request_id}, '${Api.escape(req.reference_no)}')" class="px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 border border-red-200 rounded-lg transition cursor-pointer">
                                    <i class="fa-regular fa-circle-xmark mr-1"></i> Cancel Request
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function cancelRequest(id, reference) {
            if (!confirm(`Are you sure you want to cancel request ${reference}?`)) return;
            try {
                await Api.request('resident', 'PATCH', `/api/requests/${id}/cancel`);
                renderRequests();
            } catch (err) {
                alert(err.message);
            }
        }

        // Lets the resident pick a corrected file, then sends the request back for review.
        function resubmitRequest(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,.pdf';
            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    alert('The file is larger than 5 MB. Please choose a smaller file.');
                    return;
                }
                const form = new FormData();
                form.append('file', file);
                try {
                    const data = await Api.request('resident', 'PUT', `/api/requests/${id}/resubmit`, { form });
                    alert(`Request ${data.request.reference_no} has been resubmitted for review.`);
                    renderRequests();
                } catch (err) {
                    alert(err.message);
                }
            };
            input.click();
        }

        // Shows the actual uploaded files for a request.
        async function viewFiles(id) {
            const content = document.getElementById('modalFileContent');
            document.getElementById('modalFileName').innerText = 'Submitted Files';
            content.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Loading files...</p>';
            document.getElementById('fileModal').classList.remove('hidden');

            try {
                const req = await Api.get('resident', `/api/requests/${id}`);
                document.getElementById('modalFileName').innerText = `${req.reference_no} - ${req.document_type}`;
                content.innerHTML = req.files.length === 0
                    ? '<p class="text-xs text-gray-400 italic text-center py-6">No attached files</p>'
                    : req.files.map(renderFilePreview).join('');
            } catch (err) {
                content.innerHTML = `<p class="text-xs text-red-600 text-center py-6">${Api.escape(err.message)}</p>`;
            }
        }

        function renderFilePreview(file) {
            const header = `
                <div class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-2">
                    <span class="truncate"><i class="fa-regular ${file.mime_type === 'application/pdf' ? 'fa-file-pdf text-red-500' : 'fa-file-image text-slate-400'} mr-1"></i>${Api.escape(file.file_name)}</span>
                    <span class="text-[10px] text-slate-400 shrink-0 ml-2">${Api.escape(Api.formatDate(file.uploaded_at))}</span>
                </div>`;
            if (!file.data_url) {
                return `<div class="mb-4">${header}<p class="text-xs text-gray-400 italic">Preview not available.</p></div>`;
            }
            const preview = file.mime_type === 'application/pdf'
                ? `<iframe src="${Api.escape(file.data_url)}" class="w-full h-80 rounded-lg border border-slate-200"></iframe>`
                : `<img src="${Api.escape(file.data_url)}" alt="${Api.escape(file.file_name)}" class="w-full max-h-80 object-contain rounded-lg border border-slate-200 bg-slate-50">`;
            return `<div class="mb-4">${header}${preview}</div>`;
        }

        function closeFileModal() {
            document.getElementById('fileModal').classList.add('hidden');
        }
    </script>
</body>
</html>
